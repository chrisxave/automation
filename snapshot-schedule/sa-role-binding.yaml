apiVersion: v1
kind: ServiceAccount
metadata:
  name: vm-snapshotter  #  Define a consistent name
  namespace: <insert namespace here> #  Use your target namespace

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vm-snapshot-role
  namespace: <insert namespace here>
rules:
  - apiGroups: ["snapshot.kubevirt.io"]
    resources: ["virtualmachinesnapshots"]
    verbs: ["create", "delete", "list", "get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vm-snapshot-rolebinding
  namespace: <insert namespace here>
subjects:
  - kind: ServiceAccount
    name: vm-snapshotter  #  Reference the consistent name
    namespace: <insert namespace here>
roleRef:
  kind: Role
  name: vm-snapshot-role
  apiGroup: rbac.authorization.k8s.io
